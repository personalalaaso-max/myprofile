 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alaa Abdelaty | Portfolio</title>
    <!-- خط حديث ومميز -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .card {
            background: #121212;
            border: 1px solid #222222;
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }

        /* إضاءة دائرية خفيفة خلف الصورة */
        .card::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.05);
            filter: blur(60px);
            border-radius: 50%;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 1;
        }

        /* إطار الصورة الشخصية */
        .profile-img-box {
            width: 140px;
            height: 140px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #ffffff, #333333);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            border-radius: 50%;
        }

        /* الاسم والتخصص */
        .name {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 0.3rem;
            background: linear-gradient(180deg, #ffffff 40%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title {
            font-size: 1rem;
            color: #a0a0a0;
            font-weight: 400;
            margin-bottom: 2rem;
            letter-spacing: 0.5px;
        }

        /* قائمة الروابط */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0.9rem 1.2rem;
            background: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 14px;
            border: 1px solid #2a2a2a;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-link i {
            font-size: 1.2rem;
        }

        .btn-link:hover {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        /* ألوان الأيقونات عند الوقوف بالماوس */
        .btn-link:hover .fa-whatsapp { color: #25D366; }
        .btn-link:hover .fa-telegram { color: #0088cc; }
        .btn-link:hover .fa-facebook { color: #1877F2; }
        .btn-link:hover .fa-instagram { color: #E4405F; }
        .btn-link:hover .fa-envelope { color: #EA4335; }

        .footer-text {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="content">
            <!-- الصورة الشخصية -->
            <div class="profile-img-box">
                <!-- احفظ صورتك باسم profile.jpg وضدها في نفس المجلد -->
                <img src="profile.jpg" alt="Alaa Abdelaty Salah" class="profile-img">
            </div>

            <!-- الاسم -->
            <h1 class="name">Alaa Abdelaty Salah</h1>

            <!-- التخصص -->
            <p class="title">Software Engineer | Front-End Developer</p>

            <!-- الأزرار والروابط -->
            <div class="links-container">
                <!-- واتساب -->
                <a href="https://wa.me/201096371736" target="_blank" class="btn-link">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>واتساب (WhatsApp)</span>
                </a>

                <!-- تليجرام -->
                <a href="https://t.me/+201096371736" target="_blank" class="btn-link">
                    <i class="fa-brands fa-telegram"></i>
                    <span>تليجرام (Telegram)</span>
                </a>

                <!-- فيسبوك -->
                <a href="https://www.facebook.com/share/1BmdAXxu3G/" target="_blank" class="btn-link">
                    <i class="fa-brands fa-facebook"></i>
                    <span>فيسبوك (Facebook)</span>
                </a>

                <!-- إنستجرام -->
                <a href="https://www.instagram.com/3laa_sallah" target="_blank" class="btn-link">
                    <i class="fa-brands fa-instagram"></i>
                    <span>إنستجرام (Instagram)</span>
                </a>

                <!-- البريد الإلكتروني -->
                <a href="mailto:Personalalaaso@gmail.com" class="btn-link">
                    <i class="fa-solid fa-envelope"></i>
                    <span>البريد الإلكتروني (Email)</span>
                </a>
            </div>

            <p class="footer-text">© 2026 Alaa Abdelaty. All rights reserved.</p>
        </div>
    </div>

</body>
</html>
